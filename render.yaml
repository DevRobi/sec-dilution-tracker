# Render Blueprint — backend (FastAPI) + Postgres for the NON-AI deploy.
# Frontend goes on Vercel separately (see DEPLOY.md).
#
# In Render: New + → "Blueprint" → pick this repo. Render reads this file,
# creates the web service + database, and prompts for the secret env vars
# marked `sync: false`. See DEPLOY.md for the full step-by-step.

services:
  - type: web
    name: dilution-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # "free" works too (sleeps after 15 min idle); starter (~$7/mo) is always-on
    healthCheckPath: /
    envVars:
      # ---- the off-switch that makes the cloud build work without Ollama/Docling
      - key: ENABLE_AI_EXTRACTION
        value: "false"
      # ---- seed lightweight company rows so ticker search works before cron fills stats
      - key: SEED_TICKER_UNIVERSE
        value: "true"
      # ---- DB: auto-wired from the Render Postgres below
      - key: DATABASE_URL
        fromDatabase:
          name: dilution-db
          property: connectionString
      # ---- auth
      - key: JWT_SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_API_KEY
        generateValue: true
      # ---- secrets: Render will PROMPT for these (never committed)
      - key: SEC_USER_AGENT          # SEC requires a real contact email
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      # ---- email alerts (optional; leave blank to disable)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false

  - type: cron
    name: dilution-non-ai-daily-sync
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: .
    schedule: "0 9 * * *"          # daily at 09:00 UTC
    dockerCommand: python -m app.jobs.non_ai_daily_sync
    envVars:
      - key: ENABLE_AI_EXTRACTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: dilution-db
          property: connectionString
      - key: PRELOAD_TICKERS
        value: "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,BRK-B,JPM,XOM,UNH,V,MA,AVGO,LLY,COST,HD,PG,NKE,POET"
      - key: NON_AI_SYNC_DELAY_SECONDS
        value: "3"
      - key: SEC_USER_AGENT
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false

  - type: cron
    name: dilution-ai-daily-sync
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: .
    schedule: "0 11 * * *"          # daily at 11:00 UTC (after non-AI job)
    dockerCommand: python -m app.jobs.ai_dilution_daily_sync
    envVars:
      - key: ENABLE_AI_EXTRACTION
        value: "true"
      - key: DILUTION_LLM_PROVIDER
        value: "anthropic"
      - key: DILUTION_LLM_MODEL
        value: "claude-haiku-5-5"
      - key: DATABASE_URL
        fromDatabase:
          name: dilution-db
          property: connectionString
      - key: PRELOAD_TICKERS
        value: "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,BRK-B,JPM,XOM,UNH,V,MA,AVGO,LLY,COST,HD,PG,NKE,POET"
      - key: AI_DILUTION_DELAY_SECONDS
        value: "15"
      - key: AI_DILUTION_MAX_FILINGS
        value: "12"
      - key: SEC_USER_AGENT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false

databases:
  - name: dilution-db
    plan: free                       # free expires after 30 days; swap to Neon or a paid plan for permanence
    databaseName: buyback_tracker
    user: buyback
